<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Graphify: an easy guide</title>

<style>
  :root{
    --bg:#000000;
    --fg:#ffffff;
    --silver:#A0A0A0;
    --silver-dim:#5a5a5a;
    --accent:#e9e9e9;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--fg);
    font-family:'Courier New', 'Segoe UI', monospace, sans-serif;
  }
  body{
    display:flex;
    flex-direction:column;
    height:100vh;
    width:100vw;
    align-items:center;
    justify-content:space-between;
    padding:10px 0;
  }

  #graphCanvas{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    z-index:0;
    opacity:.5;
  }

  .main-wrap{
    position:relative;
    z-index:1;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
    text-align:center;
    gap:16px;
    width:100%;
  }

  .badge{
    border:1px solid var(--silver-dim);
    color:var(--silver);
    font-size:11px;
    letter-spacing:2px;
    padding:5px 14px;
    border-radius:8px;
    text-transform:uppercase;
    animation:fadeIn 0.8s ease;
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(2px);
  }

  h1{
    font-size:clamp(24px, 6.2vw, 40px);
    font-weight:800;
    letter-spacing:.5px;
    line-height:1.25;
    animation:fadeIn 1s ease;
    text-shadow:0 2px 20px rgba(0,0,0,.8);
  }
  h1 span{ color:var(--accent); }

  .subtitle{
    color:var(--silver);
    font-size:clamp(12px, 2.6vw, 15px);
    max-width:340px;
    animation:fadeIn 1.2s ease;
    text-shadow:0 2px 12px rgba(0,0,0,.9);
  }

  #enterBtn{
    background:var(--fg);
    color:#000;
    border:none;
    padding:16px 38px;
    font-size:15px;
    font-weight:800;
    border-radius:10px;
    letter-spacing:.5px;
    text-transform:uppercase;
    cursor:pointer;
    animation:fadeIn 1.4s ease, pulseBtn 2.5s infinite ease-in-out;
    box-shadow:0 4px 20px rgba(255,255,255,.15);
    transition:transform .15s ease;
  }
  #enterBtn:active{ transform:scale(.97); }
  @keyframes pulseBtn{
    0%,100%{ box-shadow:0 4px 20px rgba(255,255,255,.15); }
    50%{ box-shadow:0 4px 28px rgba(255,255,255,.35); }
  }

  .fans-row{
    display:flex; align-items:center; gap:8px; color:var(--silver);
    font-size:11.5px; animation:fadeIn 1.6s ease;
  }
  .avatars{ display:flex; }
  .avatars span{
    width:20px;height:20px; border-radius:50%;
    background:linear-gradient(135deg,#333,#666);
    border:1.5px solid #000; margin-left:-8px; display:inline-block;
  }
  .avatars span:first-child{margin-left:0;}

  @keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  .ad-slot-small{
    position:relative; z-index:1;
    margin:4px 0;
    width:320px; min-height:50px; height:auto; max-width:94%;
    background:#0a0a0a; border:1px dashed var(--silver-dim); border-radius:8px;
    display:flex; align-items:center; justify-content:center;
  }
  .ad-slot-small iframe{ max-width:100% !important; display:block !important; }
</style>
</head>
<body>

  <canvas id="graphCanvas"></canvas>

  <!-- ===== AD TOP ===== -->
  <div class="ad-slot-small" id="adSlotTop">
    <script type="text/javascript">
      atOptions = { 'key' : '87b04073200cdd655a562f19119611bb', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
    </script>
    <script type="text/javascript" src="https://cleavegrate.com/87b04073200cdd655a562f19119611bb/invoke.js"></script>
  </div>

  <div class="main-wrap">
    <div class="badge">Beginner Guide · 2026</div>
    <h1>Help your <span>AI</span><br>understand your project</h1>
    <p class="subtitle">Graphify is a free tool that builds a "map" of your project for Claude Code (or Cursor). It answers better, faster, and stops getting lost.</p>
    <button id="enterBtn">See how it works</button>
    <div class="fans-row">
      <span class="avatars"><span></span><span></span><span></span></span>
      <span><strong id="fansCount">6,214</strong> people already read this</span>
    </div>
  </div>

  <!-- ===== AD BOTTOM ===== -->
  <div class="ad-slot-small" id="adSlotBottom">
    <script type="text/javascript">
      atOptions = { 'key' : '87b04073200cdd655a562f19119611bb', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
    </script>
    <script type="text/javascript" src="https://cleavegrate.com/87b04073200cdd655a562f19119611bb/invoke.js"></script>
  </div>

<script>
  // ===== CONFIG =====
  const STEP2_LINK = "graphify-step2-en.html";

  document.getElementById('enterBtn').addEventListener('click', () => {
    window.location.href = STEP2_LINK;
  });

  const fansEl = document.getElementById('fansCount');
  let fans = parseInt(fansEl.textContent.replace(/,/g,''));
  setInterval(() => {
    fans += Math.floor(Math.random()*3);
    fansEl.textContent = fans.toLocaleString('en-US');
  }, 4000);

  // ===== NODE GRAPH ANIMATION (silver/white only) =====
  const canvas = document.getElementById('graphCanvas');
  const ctx = canvas.getContext('2d');
  let W, H;
  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  const COLORS = ['#ffffff','#c9c9c9','#A0A0A0'];
  const N = Math.min(70, Math.floor((window.innerWidth * window.innerHeight) / 14000));
  const nodes = Array.from({length:N}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    vx: (Math.random()-.5)*0.25, vy: (Math.random()-.5)*0.25,
    r: Math.random()*1.6 + 1,
    c: COLORS[Math.floor(Math.random()*COLORS.length)]
  }));
  const LINK_DIST = 120;

  function tick(){
    ctx.clearRect(0,0,W,H);
    for(const n of nodes){
      n.x += n.vx; n.y += n.vy;
      if(n.x < 0 || n.x > W) n.vx *= -1;
      if(n.y < 0 || n.y > H) n.vy *= -1;
    }
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const a = nodes[i], b = nodes[j];
        const dx = a.x-b.x, dy = a.y-b.y;
        const d = Math.sqrt(dx*dx+dy*dy);
        if(d < LINK_DIST){
          ctx.strokeStyle = `rgba(200,200,200,${(1 - d/LINK_DIST) * 0.22})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
          ctx.stroke();
        }
      }
    }
    for(const n of nodes){
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
      ctx.fillStyle = n.c;
      ctx.globalAlpha = 0.8;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    requestAnimationFrame(tick);
  }
  tick();
</script>

</html>
